name: AEE Attestation Probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-probe:
    runs-on: ubuntu-latest
    environment: TED_PREVIEW

    steps:
      - name: Stabilize deterministic probe subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          printf '%s' 'AEE_ENVIRONMENT_PROBE_v1' > probe/marker.txt
          tar --sort=name \
              --mtime='UTC 1970-01-01' \
              --owner=0 --group=0 --numeric-owner \
              -cf aee_subject.tar -C probe marker.txt
          sha256sum aee_subject.tar | tee subject.sha256

      - name: Attest exact subject
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: aee_subject.tar

      - name: Preserve subject and attestation metadata
        uses: actions/upload-artifact@v4
        with:
          name: aee-stage2-probe
          path: |
            aee_subject.tar
            subject.sha256
          if-no-files-found: error
          retention-days: 30
