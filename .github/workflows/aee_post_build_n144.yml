name: AEE Post-Build N144

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n144:
    name: AEE N144 execution gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner identity
        run: |
          uname -a
          uname -m
          id

      - name: Verify base environment and patch
        run: |
          test -f AEE_POST_BUILD_EXECUTION_ENVIRONMENT_v0.1.zip
          test -f AEE_EXECUTION_WRAPPER_PATCH_v0.1.zip

          BASE_SHA="$(
            sha256sum AEE_POST_BUILD_EXECUTION_ENVIRONMENT_v0.1.zip \
            | awk '{print $1}'
          )"

          PATCH_SHA="$(
            sha256sum AEE_EXECUTION_WRAPPER_PATCH_v0.1.zip \
            | awk '{print $1}'
          )"

          test "$BASE_SHA" = \
            "39fe56f758b3fddd58c22bf621b16e69eab7122359a6989bafa2163852dc1372"

          test "$PATCH_SHA" = \
            "947c56b94b1bf956dc351223efe0ae9bc566506fd5ae132b1cb8023e5ff5c290"

          echo "Base environment SHA-256: $BASE_SHA"
          echo "Wrapper patch SHA-256: $PATCH_SHA"

      - name: Extract frozen environment
        run: |
          rm -rf aee_post_build_environment
          mkdir aee_post_build_environment

          unzip -q AEE_POST_BUILD_EXECUTION_ENVIRONMENT_v0.1.zip \
            -d aee_post_build_environment

          ENV_ROOT="$(
            find aee_post_build_environment \
              -type f \
              -path '*/scripts/run_gate.sh' \
              -printf '%h\n' \
            | sed 's#/scripts$##' \
            | head -n 1
          )"

          test -n "$ENV_ROOT"
          echo "$ENV_ROOT" > /tmp/aee_env_root

          echo "Frozen environment root: $ENV_ROOT"

      - name: Apply verified execution-wrapper patch
        run: |
          ENV_ROOT="$(cat /tmp/aee_env_root)"

          rm -rf aee_wrapper_patch
          mkdir aee_wrapper_patch

          unzip -q AEE_EXECUTION_WRAPPER_PATCH_v0.1.zip \
            -d aee_wrapper_patch

          PATCH_ROOT="$(
            find aee_wrapper_patch \
              -type f \
              -path '*/scripts/verify_and_stage.py' \
              -printf '%h\n' \
            | sed 's#/scripts$##' \
            | head -n 1
          )"

          test -n "$PATCH_ROOT"

          PATCHED_SCRIPT_SHA="$(
            sha256sum "$PATCH_ROOT/scripts/verify_and_stage.py" \
            | awk '{print $1}'
          )"

          test "$PATCHED_SCRIPT_SHA" = \
            "d3a5d1012cffdf1abb559ec3b4224a661423fbeb9d925d64a7528982d92a14d2"

          cp "$PATCH_ROOT/scripts/verify_and_stage.py" \
            "$ENV_ROOT/scripts/verify_and_stage.py"

          INSTALLED_SHA="$(
            sha256sum "$ENV_ROOT/scripts/verify_and_stage.py" \
            | awk '{print $1}'
          )"

          test "$INSTALLED_SHA" = "$PATCHED_SCRIPT_SHA"

          echo "Wrapper patch applied: $INSTALLED_SHA"

      - name: Verify frozen candidate remains unchanged
        run: |
          ENV_ROOT="$(cat /tmp/aee_env_root)"

          CANDIDATE="$ENV_ROOT/payload/AEE_IMPLEMENTATION_CANDIDATE_v0.2.1_FROM_v0.1.8.zip"

          test -f "$CANDIDATE"

          CANDIDATE_SHA="$(
            sha256sum "$CANDIDATE" \
            | awk '{print $1}'
          )"

          test "$CANDIDATE_SHA" = \
            "1e12e8dcc67f9511c15c1691975fec02238a52e03e319fe3251ca5a5fc23d527"

          echo "Exact candidate preserved: $CANDIDATE_SHA"

      - name: Execute frozen N144 environment gate
        run: |
          ENV_ROOT="$(cat /tmp/aee_env_root)"

          test -f "$ENV_ROOT/scripts/preflight.sh"
          test -f "$ENV_ROOT/scripts/run_gate.sh"
          test -f "$ENV_ROOT/scripts/run_n144.py"
          test -f "$ENV_ROOT/scripts/verify_and_stage.py"

          chmod +x "$ENV_ROOT/scripts/preflight.sh"
          chmod +x "$ENV_ROOT/scripts/run_gate.sh"

          cd "$ENV_ROOT"

          sudo ./scripts/run_gate.sh

      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEE_N144_EXECUTION_EVIDENCE
          path: |
            aee_post_build_environment/
            aee_wrapper_patch/
          if-no-files-found: error
          retention-days: 30
