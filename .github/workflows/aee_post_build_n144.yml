name: AEE Post-Build N144

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n144:
    name: AEE N144 execution gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner identity
        run: |
          uname -a
          uname -m
          id

      - name: Locate execution package
        run: |
          test -f AEE_POST_BUILD_EXECUTION_ENVIRONMENT_v0.1.zip
          sha256sum AEE_POST_BUILD_EXECUTION_ENVIRONMENT_v0.1.zip

      - name: Extract execution environment
        run: |
          rm -rf aee_post_build_environment
          mkdir aee_post_build_environment

          unzip -q AEE_POST_BUILD_EXECUTION_ENVIRONMENT_v0.1.zip \
            -d aee_post_build_environment

          echo "=== Extracted package structure ==="
          find aee_post_build_environment -maxdepth 4 -type f -print

      - name: Execute frozen N144 environment gate
        run: |
          ENV_ROOT="$(
            find aee_post_build_environment \
              -type f \
              -path '*/scripts/run_gate.sh' \
              -printf '%h\n' \
            | sed 's#/scripts$##' \
            | head -n 1
          )"

          test -n "$ENV_ROOT"

          echo "Frozen environment root: $ENV_ROOT"

          test -f "$ENV_ROOT/scripts/preflight.sh"
          test -f "$ENV_ROOT/scripts/run_gate.sh"
          test -f "$ENV_ROOT/scripts/run_n144.py"
          test -f "$ENV_ROOT/scripts/verify_and_stage.py"

          chmod +x "$ENV_ROOT/scripts/preflight.sh"
          chmod +x "$ENV_ROOT/scripts/run_gate.sh"

          cd "$ENV_ROOT"

          sudo ./scripts/run_gate.sh

      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEE_N144_EXECUTION_EVIDENCE
          path: |
            aee_post_build_environment/
          if-no-files-found: error
          retention-days: 30
